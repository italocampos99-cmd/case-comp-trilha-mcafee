<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missão McAfee · Trilha de vendas</title>
<style>
:root{
  --navy:#0B1F3A;--navy2:#13315c;--ink:#1B2A41;--muted:#5B6B82;--bg:#F3F5F9;--card:#fff;--line:#E2E7EF;
  --orange:#F26A1B;--amber:#FFB84D;--teal:#0E8F80;--teal-bg:#E3F5F2;
  --green:#17804A;--green-bg:#E4F5EB;--yellow:#8A5A00;--yellow-bg:#FFF3D6;--red:#B83232;--red-bg:#FCE8E8;
  --r:16px;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
p{margin:0 0 12px}
h1{font-size:26px;line-height:1.2;margin:0 0 8px;color:var(--navy)}
h2{font-size:20px;margin:0 0 8px;color:var(--navy)}

/* ---------- topo ---------- */
.top{background:var(--navy);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20}
.top-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.logo{width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#FFB84D 0 52%,#F26A1B 52% 100%);position:relative;flex:none}
.logo:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--navy);transform:translateY(-1px)}
.score{font-size:13px;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:999px;white-space:nowrap;display:inline-block}
.score.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.25);background:var(--amber);color:var(--navy)}}
.steps{max-width:820px;margin:10px auto 0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.steps div{font-size:11px;text-align:center;opacity:.6;transition:opacity .3s}
.steps div i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin-bottom:4px;position:relative;overflow:hidden}
.steps div i:after{content:"";position:absolute;inset:0;background:var(--amber);transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease)}
.steps div.done{opacity:1}.steps div.done i:after{transform:scaleX(1)}
.steps div.now{opacity:1;font-weight:700}.steps div.now i{background:#fff}

main{max-width:820px;margin:0 auto;padding:18px 16px 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:14px}
main>.card:first-child{margin-top:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.lead{font-size:17px;color:var(--muted)}
ul.clean{margin:0 0 12px;padding-left:20px}
ul.clean li{margin:4px 0}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:600;padding:13px 22px;min-height:48px;position:relative;overflow:hidden;transition:transform .15s,background .2s}
.btn:hover{background:var(--navy2);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn.call{background:var(--green)}.btn.call:hover{background:#126a3d}
.btn.go{background:var(--orange)}.btn.go:hover{background:#d85a10}
.next{margin-top:16px;text-align:right}

/* ---------- animações de entrada ---------- */
.rise{animation:rise .55s var(--ease) both}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}.rise.d4{animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pop{animation:pop .5s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}

/* ---------- hub / intro de fase ---------- */
.phases{display:grid;gap:10px;margin:16px 0}
.phase{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:12px;padding:12px 14px}
.phase .n{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.phase.g .n{background:var(--orange)}
.phase b{display:block}.phase span{color:var(--muted);font-size:14px}
.splash{text-align:center;padding:34px 22px}
.splash .badge{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--amber));font-size:38px;margin-bottom:12px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}

/* ---------- videochamada ---------- */
.screen{position:relative;background:#0a1220;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;box-shadow:0 8px 30px rgba(11,31,58,.25)}
.screen video,.screen img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:12px;top:12px;background:rgba(10,18,32,.65);color:#fff;font-size:13px;padding:5px 10px;border-radius:8px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(4px)}
.live{width:8px;height:8px;border-radius:50%;background:#ff4d4d;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}
.pip{position:absolute;right:12px;top:12px;width:22%;max-width:150px;aspect-ratio:4/3;background:linear-gradient(135deg,#223a5e,#13233d);border:1.5px solid rgba(255,255,255,.25);border-radius:10px;display:grid;place-items:center;color:#fff;font-size:12px}
.pip svg{width:38%;opacity:.6;margin-bottom:14px}
.pip span{position:absolute;bottom:5px;left:8px;font-size:11px;opacity:.85}
.ctl{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.ctl button{background:rgba(10,18,32,.65);color:#fff;border:0;border-radius:999px;padding:7px 13px;font-size:13px;min-height:34px;backdrop-filter:blur(4px)}
.cc{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(5,10,20,.88));color:#fff;font-size:clamp(14px,2.3vw,18px);line-height:1.4}
.cc:empty{display:none}
.cc.has-ctl{padding-right:150px}
.cc.swap{animation:ccin .35s var(--ease)}
@keyframes ccin{from{opacity:0;transform:translateY(8px)}}
.playfix{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;background:var(--orange);color:#fff;border:0;border-radius:999px;padding:14px 26px;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:pop .4s var(--ease) both}
.rd{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#fff;overflow:hidden}
.rd summary{padding:14px 16px;font-weight:700;cursor:pointer;color:var(--navy);list-style:none;display:flex;justify-content:space-between;gap:10px}
.rd summary::-webkit-details-marker{display:none}
.rd summary:after{content:"+";font-weight:400;font-size:20px;line-height:1}
.rd[open] summary:after{content:"–"}
.rd .bd{padding:0 16px 16px;font-size:15px}
.rd table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.rd th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:600;font-size:13px}
.rd td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rd td.y{color:var(--green);font-weight:700}.rd td.n{color:var(--muted)}
.rd ol,.rd ul{margin:6px 0 10px;padding-left:20px}
.rd .warn{background:var(--red-bg);border-radius:10px;padding:10px 12px;color:#6E1C1C;margin-top:8px}
.skipbar{background:var(--green-bg);border:1.5px solid #9fd8b6;border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0}
.skipbar span{color:#0F5233;font-size:15px}
.ctlv{position:absolute;right:12px;top:12px}
.ctlv button{background:rgba(10,18,32,.65);color:#fff;border:0;border-radius:999px;padding:6px 12px;font-size:13px;min-height:32px}
.ring{position:absolute;inset:0;border-radius:var(--r);box-shadow:inset 0 0 0 0 transparent;pointer-events:none}
.ring.good{animation:ringg .9s ease-out}.ring.bad{animation:ringb .9s ease-out}
@keyframes ringg{0%{box-shadow:inset 0 0 0 6px rgba(23,180,90,.95)}100%{box-shadow:inset 0 0 0 0 rgba(23,180,90,0)}}
@keyframes ringb{0%{box-shadow:inset 0 0 0 6px rgba(220,60,60,.95)}100%{box-shadow:inset 0 0 0 0 rgba(220,60,60,0)}}
.meter{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px;display:flex;align-items:center;gap:12px;font-size:14px}
.meter b{white-space:nowrap}
.bar{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:6px;background:linear-gradient(90deg,var(--red),var(--amber),var(--green));background-size:400px 100%;transition:width .9s cubic-bezier(.3,1.5,.5,1)}
.mood{min-width:108px;text-align:right;font-weight:600;color:var(--navy)}
.ctx{font-size:13px;color:var(--muted);margin-bottom:10px}
.q{font-weight:600;margin:0 0 10px;color:var(--navy)}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opts.hidden{display:none}
.opts li{animation:rise .5s var(--ease) both}
.opts li:nth-child(2){animation-delay:.1s}.opts li:nth-child(3){animation-delay:.2s}.opts li:nth-child(4){animation-delay:.3s}.opts li:nth-child(5){animation-delay:.4s}.opts li:nth-child(6){animation-delay:.5s}
.wait{color:var(--muted);font-size:14px;display:flex;gap:10px;align-items:center}
.wave{display:inline-flex;gap:3px;align-items:flex-end;height:16px}
.wave i{width:3px;background:var(--orange);border-radius:2px;animation:wave 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{height:4px}50%{height:16px}}
.opt{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;line-height:1.45;transition:border-color .15s,background .15s,transform .15s,opacity .3s}
.opt:hover:not(:disabled){border-color:var(--navy);background:#FAFBFD;transform:translateX(4px)}
.opt:disabled{cursor:default;opacity:.45}
.opt.picked{opacity:1;border-color:var(--navy);border-width:2px;background:#FAFBFD;animation:pick .45s var(--ease)}
@keyframes pick{40%{transform:scale(1.02)}}
.fb{border-radius:12px;padding:16px;margin-top:16px;animation:rise .5s var(--ease) both}
.fb.p2{background:var(--green-bg);color:#0F5233}
.fb.p1{background:var(--yellow-bg);color:#5C3C00}
.fb.p0{background:var(--red-bg);color:#7A1F1F}
.fb .tagline{font-weight:700;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.fb .best{margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.12);font-size:15px}
.src{font-size:13px;margin-top:10px;opacity:.85}
.memo{margin-top:10px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.65);font-size:15px;font-weight:600}
.later{background:var(--bg);border-left:5px solid var(--navy);border-radius:12px;padding:14px 16px;margin:14px 0}
.later b{display:block;color:var(--navy);margin-bottom:4px}.later p{margin:6px 0 0}
.aid{background:var(--teal-bg);border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:15px}
.aid table{width:100%;border-collapse:collapse;margin-top:6px}
.aid td{text-align:left;padding:5px 0;border-bottom:1px solid rgba(14,143,128,.2)}
.aid tr:last-child td{border:0}
.client{display:flex;gap:14px;background:var(--bg);border-radius:12px;padding:14px;margin:16px 0}
.avatar{width:56px;height:56px;border-radius:50%;flex:none;background-size:cover;background-position:center 25%}
.client b{display:block}.client span{color:var(--muted);font-size:14px}

/* ---------- caça-golpe ---------- */
.game{background:radial-gradient(120% 90% at 50% 0,#1b3a6b 0,#0B1F3A 60%);border-radius:var(--r);padding:18px 16px 22px;color:#fff;overflow:hidden;position:relative}
.g-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:10px}
.streak{background:rgba(255,255,255,.12);padding:3px 12px;border-radius:999px;font-weight:700}
.streak.hot{animation:bump .5s var(--ease)}
.timer{height:8px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5a5a,#FFB84D 40%,#37d67a);background-size:300% 100%;transform-origin:left}
.deck{position:relative;min-height:290px;display:grid;place-items:center;perspective:900px}
.deck:before,.deck:after{content:"";position:absolute;left:8%;right:8%;top:14px;bottom:-4px;background:rgba(255,255,255,.08);border-radius:18px;transform:scale(.94)}
.deck:after{left:14%;right:14%;top:24px;background:rgba(255,255,255,.05);transform:scale(.88)}
.gcard{position:relative;z-index:2;width:100%;background:#fff;color:var(--ink);border-radius:18px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.4);touch-action:pan-y;user-select:none;cursor:grab;transition:transform .35s var(--ease),opacity .3s}
.gcard.enter{animation:cardin .5s var(--ease) both}
@keyframes cardin{from{opacity:0;transform:translateY(40px) scale(.9) rotate(3deg)}}
.gcard.drag{transition:none;cursor:grabbing}
.gcard .stamp{position:absolute;top:14px;padding:4px 12px;border:3px solid;border-radius:8px;font-weight:800;font-size:18px;letter-spacing:.05em;opacity:0;transform:rotate(-12deg)}
.gcard .stamp.s{right:14px;color:#D64545;border-color:#D64545;transform:rotate(12deg)}
.gcard .stamp.l{left:14px;color:#17804A;border-color:#17804A}
.gcard.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.gbtn{border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;min-height:52px;transition:transform .15s}
.gbtn:active{transform:scale(.96)}
.gbtn.s{background:#D64545;color:#fff}.gbtn.l{background:#17804A;color:#fff}
.gbtn:disabled{opacity:.4}
.ghint{text-align:center;font-size:12px;opacity:.65;margin-top:8px}
.gfb{margin-top:14px;border-radius:14px;padding:14px 16px;animation:rise .4s var(--ease) both;color:var(--ink);background:#fff}
.gfb.ok{border-left:6px solid var(--green)}.gfb.no{border-left:6px solid var(--red)}
.gfb h3{margin:0 0 6px;font-size:16px}
.gfb ul{margin:4px 0 8px;padding-left:18px;font-size:14px}
.gfb .mc{font-size:14px;background:var(--teal-bg);border-radius:8px;padding:8px 10px;margin-top:6px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
/* mock das mensagens */
.m-from{font-size:12px;color:#6b7686;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.m-tag{font-size:11px;background:#E8EEF8;color:#36507a;border-radius:6px;padding:2px 8px;font-weight:700}
.m-sms .bub{background:#E9EEF5;border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:15px;max-width:94%}
.m-wa .bub{background:#DCF8C6;border-radius:12px 12px 12px 2px;padding:10px 12px;font-size:15px;max-width:92%}
.m-wa .head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.m-wa .ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#8ea3c2,#5d7394);display:grid;place-items:center;color:#fff;font-weight:700}
.m-mail .row{font-size:13px;color:#56657d;border-bottom:1px solid var(--line);padding:3px 0}
.m-mail .row b{color:var(--ink)}
.m-mail .body{padding-top:10px;font-size:15px}
.chip{display:inline-block;margin-top:8px;background:#EEF1F6;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px}
.m-site .bar2{display:flex;gap:8px;align-items:center;background:#EEF1F6;border-radius:999px;padding:7px 12px;font-size:13px;word-break:break-all;margin-bottom:10px}
.m-site .login{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.m-site .login div{background:#F4F6FA;border-radius:6px;padding:8px;margin-top:6px;color:#8a95a8}
.m-site .login b{display:block;margin-bottom:2px;color:var(--navy)}
.m-wifi .net{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;background:#F4F6FA;margin-bottom:6px;font-size:14px}
.m-wifi .portal{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;margin-top:8px}
.m-wifi .portal div{background:#F4F6FA;border-radius:6px;padding:8px;margin-top:6px;color:#8a95a8}
.ctxline{font-size:12px;color:#6b7686;margin-bottom:8px;font-style:italic}
.lk{display:inline;border:0;background:none;padding:0;color:#1a5fd0;text-decoration:underline;font-weight:600;cursor:pointer;font-size:inherit}
.lk.rev{color:#7a1f1f;background:#FCE8E8;border-radius:6px;padding:1px 6px;text-decoration:none;word-break:break-all;cursor:default}
.m-wa .head,.m-ad .head,.m-dm .head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.m-wa .head .m-tag,.m-ad .head .m-tag,.m-dm .head .m-tag,.m-call .who .m-tag{margin-left:auto}
.m-wa .bub+.bub{margin-top:6px}
.m-wa code{font-size:12px;word-break:break-all}
.aud{display:flex;align-items:center;gap:8px;font-weight:700}.aud i{flex:1;height:14px;background:repeating-linear-gradient(90deg,#4a7a3a 0 2px,transparent 2px 5px);opacity:.6;border-radius:3px}
.tr{font-size:13px;color:#3d5233;margin-top:6px;font-style:italic}
.m-call .who{display:flex;gap:10px;align-items:center;margin-bottom:10px}.m-call .who span{display:block;font-size:12px;color:#6b7686}
.m-call .ava,.m-ad .ava,.m-dm .ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#8ea3c2,#5d7394);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.m-call .bub{background:#EEF1F6;border-radius:12px;padding:10px 12px;font-size:15px}
.m-rcpt,.m-pixa{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.m-rcpt b,.m-pixa b{display:block;margin:6px 0 4px;color:var(--navy)}
.m-rcpt .amt{font-size:26px;font-weight:800;color:var(--navy);margin-bottom:4px}
.ln{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:5px 0}.ln span:first-child{color:#6b7686}.ln span:last-child{text-align:right;font-weight:600}
.m-pixa .fake{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.m-pixa .fake span{text-align:center;border-radius:8px;padding:7px;background:#EEF1F6;font-weight:600}.m-pixa .fake span:last-child{background:#13315c;color:#fff}
.m-push{background:#F4F6FA;border-radius:16px;padding:12px 14px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.m-push .ph{font-size:12px;color:#6b7686;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.m-pop .bar2{display:flex;gap:8px;align-items:center;background:#EEF1F6;border-radius:999px;padding:7px 12px;font-size:13px;word-break:break-all;margin-bottom:10px}
.m-pop .alert{background:#B83232;color:#fff;border-radius:10px;padding:14px;font-size:14px}.m-pop .alert b{display:block;font-size:16px;margin-bottom:4px}
.m-ad .bub,.m-dm .bub{background:#F4F6FA;border-radius:12px;padding:10px 12px;font-size:15px}
.gfb h3 .new{font-size:11px;background:var(--orange);color:#fff;border-radius:6px;padding:2px 7px;vertical-align:middle;font-weight:700}

/* ---------- resultado ---------- */
.big{font-size:54px;font-weight:800;color:var(--navy);line-height:1;position:relative}
.ringsvg{width:150px;height:150px;display:block;margin:6px auto 10px}
.ringsvg circle{fill:none;stroke-width:12;stroke-linecap:round}
.ringsvg .bg{stroke:#E6EBF3}
.ringsvg .fg{stroke:var(--green);stroke-dasharray:440;stroke-dashoffset:440;transition:stroke-dashoffset 1.6s var(--ease);transform:rotate(-90deg);transform-origin:50% 50%}
.ringsvg.fail .fg{stroke:var(--red)}
.ringnum{position:relative;text-align:center;margin-top:-112px;height:112px;display:grid;place-items:center;font-size:38px;font-weight:800;color:var(--navy)}
.verdict{display:inline-block;font-weight:700;padding:4px 12px;border-radius:999px;margin:10px 0}
.verdict.ok{background:var(--green-bg);color:var(--green)}.verdict.no{background:var(--red-bg);color:var(--red)}
table.recap{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
table.recap td{padding:8px 0;border-bottom:1px solid var(--line)}
table.recap td:last-child{text-align:right;white-space:nowrap;font-weight:600}
.pocket{border:2px dashed var(--navy);border-radius:14px;padding:16px 18px;margin-top:18px;background:#FFFDF7}
.pocket h3{margin:0 0 8px;font-size:16px;color:var(--navy)}
.pocket ol{margin:0;padding-left:20px}.pocket li{margin:6px 0}
.noprom{background:var(--red-bg);border-radius:12px;padding:12px 16px;margin-top:14px;color:#6E1C1C;font-size:15px}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
@media (max-width:520px){h1{font-size:22px}.card{padding:18px}.pip{display:none}.cc.has-ctl{padding-right:16px;padding-bottom:50px}.mood{min-width:0}.steps div{font-size:10px}.deck{min-height:320px}}

const SCORM = (() => {
  let api = null, ok = false;
  const find = w => { let n = 0; while (w && !w.API && w.parent && w.parent !== w && n < 10) { w = w.parent; n++; } return (w && w.API) || null; };
  try { api = find(window) || (window.opener ? find(window.opener) : null); } catch (e) { api = null; }
  const call = (fn, ...a) => { try { return api ? api[fn](...a) : ""; } catch (e) { return ""; } };
  return {
    init() { if (api) ok = String(call("LMSInitialize", "")) === "true"; return ok; },
    get: k => ok ? call("LMSGetValue", k) : "",
    set(k, v) { if (ok) call("LMSSetValue", k, String(v)); },
    save() { if (ok) call("LMSCommit", ""); },
    end() { if (ok) { call("LMSCommit", ""); call("LMSFinish", ""); ok = false; } },
    get connected() { return ok; }
  };
})();

const fmtTime = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${String(Math.floor(s / 3600)).padStart(4, "0")}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };

/* Conversa ramificada: refaz o caminho a partir das escolhas salvas ({s: cena, o: opção}).
   Devolve confiança, lembranças, nota por etapa, cena atual e desfecho (quando acabou). */
const TRUST_MIN = 10;                                   // confiança nesse nível ou abaixo: o cliente encerra a chamada
const cond = (c, f) => !c || (c[0] === "!" ? !f.has(c.slice(1)) : f.has(c));
const pick = (v, f, key) => Array.isArray(v) ? (v.find(x => cond(x.if, f)) || {})[key] : v;   // texto ou destino que depende das lembranças
function play(k) {
  const S = SIMS[k], f = new Set(), stage = {};
  let t = S.trust0 ?? 50, cur = S.start, end = null, n = 0;
  for (const a of R[k]) {
    const sc = S.scenes[cur], op = sc && a.s === cur && sc.options[a.o];
    if (!op || end) break;
    n++;
    t = Math.max(4, Math.min(100, t + (op.dt ?? (S.trust || TRUST)[op.q])));
    (op.set || []).forEach(x => f.add(x)); (op.unset || []).forEach(x => f.delete(x));
    if (sc.stage) stage[sc.stage] = Math.max(stage[sc.stage] || 0, op.pts ?? op.q);
    if (op.end) end = op.end;
    else if (t <= TRUST_MIN) end = "desligou";
    else { cur = op.go || pick(sc.next, f, "go"); if (cur === "$fim") end = S.finale(f, t); }
  }
  const pts = Object.values(stage).reduce((s, x) => s + x, 0) + (end ? S.ends[end].pts : 0);
  return { t, f, stage, cur, end, n, pts };
}
const totalPts = () => FLOW.reduce((s, st) => s + phasePts(st), 0);
const totalMax = () => FLOW.reduce((s, st) => s + phaseMax(st), 0);
const nextPhase = () => FLOW.find(st => !phaseDone(st));
const clearTimers = () => { timers.forEach(t => { clearTimeout(t); cancelAnimationFrame(t); }); timers = []; };

function header(activeKey) {
  const pts = totalPts();
  const sc = $("#score");
  const txt = `${pts} ${pts === 1 ? "ponto" : "pontos"}`;
  if (sc.textContent !== txt) { sc.textContent = txt; sc.classList.remove("bump"); void sc.offsetWidth; sc.classList.add("bump"); }
  $("#steps").innerHTML = FLOW.map(st => `<div class="${phaseDone(st) ? "done" : st.k === activeKey ? "now" : ""}"><i></i>${st.label}</div>`).join("");
}
function persist() {
  SCORM.set("cmi.suspend_data", JSON.stringify({ i: R.intro || 0, r: R.read || 0, g: R.g, marta: R.marta.map(x => [x.s, x.o]), jorge: R.jorge.map(x => [x.s, x.o]) }));
  SCORM.set("cmi.core.session_time", fmtTime(Date.now() - startedAt));

}

}

function runGame(k) {
  const G = GAMES[k], SECS = G.secs || 12;
  const res = []; let i = 0, streak = 0, locked = false;
  // sorteio equilibrado: G.drawScam golpes + o resto em legítimas, embaralhados
  const pickN = (arr, n) => shuffle(arr).slice(0, n).map(x => x[0]);
  const order = G.draw ? shuffle([...pickN(G.cards.filter(c => c.scam), G.drawScam), ...pickN(G.cards.filter(c => !c.scam), G.draw - G.drawScam)]).map(x => x[0]) : shuffle(G.cards).map(x => x[0]);
  const N = order.length;

  function card() {
    if (i >= N) return finish();
    locked = false;
    const c = order[i];
    screen(`
    <section class="game" aria-label="Caça-golpe">
      <div class="g-head"><span>Carta <b>${i + 1}</b> de ${N}</span><span class="streak" id="streak" aria-live="polite">🔥 ${streak}</span></div>
      <div class="timer" role="timer" aria-label="Tempo"><i id="tbar"></i></div>
      <div class="deck"><div class="gcard enter" id="gc"><span class="stamp s">GOLPE</span><span class="stamp l">LEGÍTIMA</span>${mock(c)}</div></div>
      <div class="gbtns"><button class="gbtn s" id="bs">🚩 Golpe</button><button class="gbtn l" id="bl">✅ Legítima</button></div>
      <div class="ghint">${c.link ? "Toque no link para ver o endereço real. " : ""}Arraste a carta ou use ← →</div>
      <div id="gfb" aria-live="polite"></div>
    </section>`, k);
    $("#bs").onclick = () => answer("scam"); $("#bl").onclick = () => answer("legit");
    $$(".lk").forEach(b => b.onclick = () => { b.classList.add("rev"); b.textContent = "🔗 " + b.dataset.url; b.disabled = true; });
    startTimer(); bindDrag();
  }
  function startTimer() {
    const b = $("#tbar"); if (!b) return;
    const t0 = performance.now();
    const tick = now => {
      if (locked) return;
      const left = Math.max(0, 1 - (now - t0) / (SECS * 1000));
      b.style.transform = `scaleX(${left})`; b.style.backgroundPosition = `${(1 - left) * 100}% 0`;
      if (left <= 0) return answer("timeout");
      timers.push(requestAnimationFrame(tick));
    };
    timers.push(requestAnimationFrame(tick));
  }
  function bindDrag() {
    const el = $("#gc"); let x0 = null, dx = 0;
    const stS = el.querySelector(".stamp.s"), stL = el.querySelector(".stamp.l");
    el.onpointerdown = e => { if (locked || e.target.closest(".lk")) return; x0 = e.clientX; dx = 0; el.classList.add("drag"); el.setPointerCapture(e.pointerId); };
    el.onpointermove = e => {
      if (x0 === null) return; dx = e.clientX - x0;
      el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
      stS.style.opacity = dx < -30 ? Math.min(1, -dx / 110) : 0; stL.style.opacity = dx > 30 ? Math.min(1, dx / 110) : 0;
    };
    const end = () => {
      if (x0 === null) return; x0 = null; el.classList.remove("drag");
      if (Math.abs(dx) > 100) answer(dx < 0 ? "scam" : "legit"); else { el.style.transform = ""; stS.style.opacity = stL.style.opacity = 0; }
    };
    el.onpointerup = end; el.onpointercancel = end;
  }
  function answer(choice) {
    if (locked) return; locked = true;
    const c = order[i], right = choice === (c.scam ? "scam" : "legit");
    res.push(right ? 1 : 0);
    streak = right ? streak + 1 : 0;
    const el = $("#gc");
    $("#bs").disabled = $("#bl").disabled = true;
    if (choice === "timeout") { el.classList.add("shake"); }
    else if (!reduced) { el.classList.remove("enter"); el.classList.add("drag"); void el.offsetWidth; el.classList.remove("drag"); el.style.transform = `translateX(${choice === "scam" ? -140 : 140}%) rotate(${choice === "scam" ? -22 : 22}deg)`; el.style.opacity = 0; }
    const sk = $("#streak"); sk.textContent = `🔥 ${streak}`; sk.classList.remove("hot"); void sk.offsetWidth; if (right && streak > 1) sk.classList.add("hot");
    const last = i === N - 1;
    const verdict = c.scam ? "É golpe" : "É legítima";
    $("#gfb").innerHTML = `<div class="gfb ${right ? "ok" : "no"}">
      <h3>${right ? "✓ Acertou" : choice === "timeout" ? "⏱ Tempo esgotado" : "✗ Errou"} · ${verdict}${c.tag ? ` <span class="new">em alta em ${c.tag}</span>` : ""}</h3>
      <div style="font-size:14px;margin-bottom:2px">${c.scam ? "Sinais de golpe:" : "Por que é legítima:"}</div>
      <ul>${c.flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
      <div class="mc"><b>No McAfee:</b> ${esc(c.mcafee)}</div>
      <div class="next"><button class="btn" id="gn">${last ? "Ver resultado da rodada" : "Próxima carta"}</button></div></div>`;
    $("#gn").onclick = () => { i++; card(); }; $("#gn").focus({ preventScroll: true });
    $("#gfb").scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "nearest" });
  }
  function finish() {
    R[k] = res; persist();
    const pts = gamePts(k), perfect = pts === N;
    const msg = perfect ? "Olho clínico: nenhuma passou." : pts >= N - 1 ? "Muito bom. Só uma escapou." : "Golpe bem feito engana todo mundo. Reveja os sinais de cada carta.";
    screen(`
    <section class="card splash" style="position:relative;overflow:hidden">
      <div class="confetti" id="cf" aria-hidden="true"></div>
      <div class="badge pop">${perfect ? "🏆" : "🎯"}</div>
      <div class="eyebrow rise">Rodada concluída</div>
      <div class="big rise d1" id="cnt">0<small style="font-size:22px;color:var(--muted)"> de ${N}</small></div>
      <p class="lead rise d2" style="margin-top:10px">${msg}</p>
      <button class="btn go rise d3" id="cont">Continuar a missão</button>
    </section>`, k);
    // contador animado
    const el = $("#cnt"); let n = 0; const step = () => { el.firstChild.nodeValue = n; if (n < pts) { n++; timers.push(setTimeout(step, reduced ? 0 : 260)); } }; step();
    if (perfect && !reduced) confetti($("#cf"));
    $("#cont").onclick = route;
  }
  document.onkeydown = e => { if (!locked && $("#gc")) { if (e.key === "ArrowLeft") answer("scam"); if (e.key === "ArrowRight") answer("legit"); } };
  card();
}
function confetti(box) {
  const cols = ["#F26A1B", "#FFB84D", "#17804A", "#0E8F80", "#B83232", "#13315c"];
  for (let n = 0; n < 40; n++) { const i = document.createElement("i"); i.style.left = Math.random() * 100 + "%"; i.style.background = cols[n % cols.length]; i.style.animationDelay = Math.random() * .5 + "s"; i.style.animationDuration = 1.2 + Math.random() * 1.2 + "s"; box.appendChild(i); }
}

function playOverlay(v, label, onclick) {
  const box = v.parentElement; if (!box) return;
  box.querySelectorAll(".playfix").forEach(n => n.remove());
  const b = document.createElement("button");
  b.className = "playfix"; b.type = "button"; b.textContent = label;
  b.onclick = () => { b.remove(); onclick(); };
  box.appendChild(b);
}
function playClip(v, src, { loop = false, sound = true, onend } = {}) {
  v.parentElement && v.parentElement.querySelectorAll(".playfix").forEach(n => n.remove());
  v.loop = loop; v.muted = !sound || muted; v.src = MEDIA(src); v.onended = onend || null;
  v.onerror = () => { const cc = v.parentElement && v.parentElement.querySelector(".cc"); if (cc && !/vídeo indisponível/.test(cc.textContent)) cc.insertAdjacentHTML("beforeend", '<div style="opacity:.8;font-size:.8em;margin-top:4px">(vídeo indisponível neste visualizador: siga pela legenda)</div>'); if (onend) onend(); };
  const p = v.play();
  if (p && p.catch) p.catch(() => {
    // reprodução automática com som bloqueada: tenta sem som; se ainda assim falhar, pede um toque
    v.muted = true;
    const q = v.play();
    const askTap = () => playOverlay(v, "▶ Tocar vídeo", () => { v.muted = muted; const r = v.play(); if (r && r.catch) r.catch(() => { v.muted = true; v.play(); }); });
    if (q && q.catch) q.then(() => { if (sound && !muted) playOverlay(v, "🔊 Ativar som", () => { v.muted = false; }); }).catch(askTap); else askTap();
  });
}

function runBranch(k) {
  const S = SIMS[k], P = play(k), s = S.scenes[P.cur];
  R[k] = R[k].slice(0, P.n);

  const label = s.stage ? `Etapa ${s.stage} de ${S.stages.length} · ${s.title}${s.retry ? " · segunda chance" : ""}` : s.title;
  const opts = shuffle(s.options).filter(([o]) => cond(o.if, P.f));
  screen(`
  <section aria-label="Videochamada">
    <div class="screen" id="scr">
      <video id="vid" playsinline preload="auto" poster="${MEDIA(S.poster)}" aria-label="${esc(S.person.name)} falando"></video>
      <div class="tag"><span class="live"></span> ${esc(S.display)}</div>
      ${PIP}
      <div class="cc has-ctl" id="cc">${esc(client)}</div>
      <div class="ctl"><button id="snd" aria-pressed="${muted}">${muted ? "🔇 Som" : "🔊 Som"}</button><button id="skip">Pular ▸</button></div>
      <div class="ring" id="ring"></div>
    </div>
    ${meterHtml(k, S.who)}
  </section>
  <section class="card" aria-live="polite">
    <div class="eyebrow">${esc(label)}</div>
    <div class="ctx">${esc(s.ctx)}</div>
    ${s.aid ? `<div class="aid">${s.aid}</div>` : ""}
    <div class="q" id="q">${esc(s.prompt)}</div>
    <div class="wait" id="wait"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span> ${esc(S.person.short)} está falando… suas opções aparecem quando terminar.</div>
    <ul class="opts hidden" id="opts" role="group" aria-labelledby="q">${opts.map(([o, idx]) => `<li><button class="opt" data-i="${idx}">${o.text}</button></li>`).join("")}</ul>
    <div id="out"></div>
  </section>`, k);
  const vid = $("#vid"); let revealed = false;
  const reveal = () => { if (revealed) return; revealed = true; $("#wait") && $("#wait").remove(); $("#opts").classList.remove("hidden"); $("#skip").style.display = "none"; if (s.clip) vid.pause(); };
  $("#skip").onclick = reveal;
  $("#snd").onclick = e => { muted = !muted; vid.muted = muted; e.currentTarget.textContent = muted ? "🔇 Som" : "🔊 Som"; e.currentTarget.setAttribute("aria-pressed", muted); };
  $$(".opt").forEach(b => b.onclick = () => chooseBranch(k, P.cur, +b.dataset.i, b));
  if (s.clip) {
    playClip(vid, s.clip, { onend: reveal });
    timers.push(setTimeout(() => { if (!revealed && vid.paused && vid.readyState < 2) reveal(); }, 4500));
  } else if (s.still || !S.reactions) {
    // a fala acabou de tocar na resposta anterior: só a legenda, opções logo em seguida
    timers.push(setTimeout(reveal, reduced ? 0 : 900));
  } else {
    // fala sem vídeo próprio: reação em loop e a fala na legenda, com tempo de leitura
    playClip(vid, S.reactions[s.mood ?? 1], { loop: true, sound: false });
    timers.push(setTimeout(reveal, reduced ? 0 : Math.max(2500, client.length * 45)));
  }
}

function chooseBranch(k, sid, idx, btn) {
  const S = SIMS[k], s = S.scenes[sid], o = s.options[idx];
  const before = play(k).stage[s.stage] || 0;
  R[k].push({ s: sid, o: idx });
  const P = play(k);
  $$(".opt").forEach(b => b.disabled = true); btn.classList.add("picked");
  $("#trustbar").style.width = P.t + "%"; $("#mood").textContent = moodOf(P.t);
  header(k);
  $("#ring").className = "ring " + (o.q === 2 ? "good" : o.q === 0 ? "bad" : "");
  const vid = $("#vid"), cc = $("#cc");
  cc.innerHTML = `<b>${esc(S.person.short)}:</b> ${esc(o.reply)}`; cc.classList.remove("swap"); void cc.offsetWidth; cc.classList.add("swap");
  if (o.clip) playClip(vid, o.clip, { sound: true });                // vídeo interativo: o cliente responde falando
  else {
    // reação em loop segue o humor do cliente, não a nota: mentira em que ele acredita = satisfeito; correção honesta = "hmm"
    const mood = o.dt === undefined ? o.q : o.dt > 0 ? 2 : 1;
    playClip(vid, S.reactions[mood], { loop: true, sound: false });
  }
  const tag = o.q === 2 ? ["✓", "Ótima escolha"] : o.q === 1 ? ["~", "Funciona, mas dá para melhorar"] : ["!", "Cuidado"];
  const gain = s.stage ? (P.stage[s.stage] || 0) - before : null;
  const ptsTxt = gain === null ? "não vale ponto, mas muda o final" : `+${gain} ${gain === 1 ? "ponto" : "pontos"}${s.retry && o.q === 2 ? " (segunda chance vale no máximo 1)" : ""}`;
  const best = o.q < 2 ? `<div class="best"><b>Melhor caminho:</b> ${esc(s.best)}</div>` : "";
  const memo = o.memo ? `<div class="memo">🧠 ${esc(o.memo)}</div>` : "";
  const warn = P.end === "desligou" ? `<div class="memo">📵 A confiança da ${esc(S.person.short)} chegou ao limite.</div>` : "";
  $("#out").innerHTML = `
    <div class="fb p${o.q}" role="status">
      <div class="tagline"><span aria-hidden="true">${tag[0]}</span>${tag[1]} · ${ptsTxt}</div>
      <div>${esc(o.why)}</div>${memo}${warn}${best}
      <div class="src">Fonte: ${esc(s.src)}</div>
    </div>
    <div class="next"><button class="btn" id="next">${P.end ? "Ver como terminou" : "Continuar a conversa"}</button></div>`;
  $("#next").onclick = () => P.end ? branchEnd(k) : runBranch(k);
  $("#next").focus({ preventScroll: true });
  $("#out").scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "nearest" });
  if (R[k].length === 1) SCORM.set("cmi.core.lesson_status", "incomplete");
  persist();
}

function branchEnd(k) {
  const S = SIMS[k], P = play(k), E = S.ends[P.end], max = S.max, nxt = nextPhase();
  const epi = P.end === "cancelou"
    ? [...Object.keys(S.lies).filter(x => P.f.has(x)).map(x => S.lies[x]), S.cancelLine]
    : E.epi;
  const rows = S.stages.map((n, i) => `<tr><td>${i + 1}. ${esc(n)}</td><td>${P.stage[i + 1] ?? "–"} de 2</td></tr>`).join("")
    + `<tr><td><b>Desfecho:</b> ${esc(E.title)}</td><td>${E.pts} de 2</td></tr>`;
  screen(`
  <section class="card">
    <div class="eyebrow rise">Fim da chamada</div>
    <h1 class="rise d1">${E.icon} ${esc(E.title)}</h1>
    <div class="screen rise d2" style="margin:12px 0"><video id="vid" playsinline poster="${MEDIA(S.poster)}" aria-hidden="true"></video><div class="tag"><span class="live"></span> ${esc(S.display)} · chamada encerrada</div><div class="cc">${esc(E.line)}</div></div>
    <div class="later rise d3"><b>Algumas semanas depois…</b>${epi.map(x => `<p>${esc(x)}</p>`).join("")}</div>
    <table class="recap rise d3">${rows}</table>
    <p class="rise d4" style="text-align:center"><b>${esc(S.person.name)}: ${P.pts} de ${max} pontos.</b> ${P.pts >= max * .8 ? "Conversa conduzida com firmeza e sem promessas vazias." : P.pts >= max * .5 ? "Boa conversa, com pontos para ajustar." : "Vale rever os feedbacks: cada erro aqui viraria reclamação na vida real."}</p>
    <div class="next" style="text-align:center"><button class="btn go" id="cont">${nxt ? "Próxima fase" : "Ver resultado final"}</button></div>
  </section>`, k);
  if (E.clip) playClip($("#vid"), E.clip, { sound: true });
  else if (S.reactions) playClip($("#vid"), S.reactions[E.mood], { loop: true, sound: false });
  $("#cont").onclick = route;
}

function runSim(k) { return runBranch(k); }   // os dois clientes usam a conversa ramificada

/* ============================================================
   Resultado
   ============================================================ */
function showResult() {
  const pts = totalPts(), max = totalMax(), pct = Math.round(pts / max * 100), passed = pct >= PASS;
  SCORM.set("cmi.core.score.min", 0); SCORM.set("cmi.core.score.max", 100); SCORM.set("cmi.core.score.raw", pct);
  SCORM.set("cmi.core.lesson_status", passed ? "passed" : "failed"); persist();
  const msg = pct >= 90 ? "Pronto para ligar: você enxerga golpe, traduz o produto e promete só o que existe."
    : passed ? "Aprovado. Revise as fases com nota baixa antes da próxima ligação."
    : "Ainda não. Refaça a missão: os feedbacks explicam o porquê de cada resposta.";
  const rx = passed ? SIMS.marta.reactions[2] : SIMS.marta.reactions[0];
  const rows = [["Simulador da Marta", "marta"], ["Vídeo do Seu Jorge", "jorge"], ["Caça-golpe final", "g"]]
    .map(([n, k]) => { const st = FLOW.find(f => f.k === k); return `<tr><td>${n}</td><td>${phasePts(st)} de ${phaseMax(st)}</td></tr>`; }).join("")
    + `<tr><td>Vídeo de abertura</td><td>${R.intro === "seen" ? "assistido" : "pulado"}</td></tr><tr><td>Leitura do material</td><td>${R.read === "read" ? "feita" : "pulada"}</td></tr>`;
  screen(`
  <section class="card" style="text-align:center">
    <div class="eyebrow rise">Resultado da missão</div>
    <svg class="ringsvg ${passed ? "" : "fail"}" viewBox="0 0 160 160" aria-hidden="true"><circle class="bg" cx="80" cy="80" r="70"/><circle class="fg" id="rfg" cx="80" cy="80" r="70"/></svg>
    <div class="ringnum" id="rnum">0%</div>
    <div class="verdict ${passed ? "ok" : "no"} rise d2">${passed ? "Aprovado" : "Refazer"} · ${pts} de ${max} pontos</div>
    <p class="rise d3">${msg}</p>
    <div class="screen rise d3" style="margin:10px 0;text-align:left"><video id="vid" playsinline muted loop autoplay poster="${MEDIA('media/marta.jpg')}" src="${MEDIA(rx)}" aria-hidden="true"></video><div class="tag"><span class="live"></span> Marta Souza · chamada encerrada</div><div class="cc">${passed ? "Gostei de conversar com você. Pode mandar o pedido!" : "Vou pensar com calma e te retorno…"}</div></div>
    <table class="recap" style="text-align:left">${rows}</table>
    <div class="pocket" style="text-align:left"><h3>Cartão de bolso: leve para a próxima ligação</h3><ol>${POCKET.map(l => `<li>${l}</li>`).join("")}</ol></div>
    <div class="noprom" style="text-align:left">${esc(NOPROMISE)}</div>
    <div class="next" style="text-align:center"><button class="btn ghost" id="retry">Refazer a missão</button></div>
  </section>`);
  header(null);
  const fg = $("#rfg"), num = $("#rnum");
  requestAnimationFrame(() => { fg.style.strokeDashoffset = 440 - 440 * pct / 100; });
  let n = 0; const step = () => { num.textContent = n + "%"; if (n < pct) { n += Math.max(1, Math.ceil((pct - n) / 12)); timers.push(setTimeout(step, reduced ? 0 : 50)); } else num.textContent = pct + "%"; }; step();
  $("#retry").onclick = () => { R = { intro: false, read: null, marta: [], jorge: [], g: null }; startedAt = Date.now(); showHub(); header(null); };
}

/* ============================================================
   Início
   ============================================================ */
function boot() {
  SCORM.init();
  if (SCORM.connected) {
    const status = SCORM.get("cmi.core.lesson_status");
    if (!status || status === "not attempted") SCORM.set("cmi.core.lesson_status", "incomplete");
    try {
      const sd = JSON.parse(SCORM.get("cmi.suspend_data") || "{}");
      if (sd.i) R.intro = sd.i;
      if (sd.r) R.read = sd.r;
      if (Array.isArray(sd.g)) R.g = sd.g;
      if (Array.isArray(sd.marta)) { R.marta = sd.marta.map(x => ({ s: x[0], o: x[1] })); R.marta = R.marta.slice(0, play("marta").n); }
      if (Array.isArray(sd.jorge)) { R.jorge = sd.jorge.map(x => ({ s: x[0], o: x[1] })); R.jorge = R.jorge.slice(0, play("jorge").n); }
    } catch (e) { R = { intro: false, read: null, marta: [], jorge: [], g: null }; }
  }
  const any = R.intro || R.read || R.g || R.marta.length || R.jorge.length;
  header(null);
  if (any) route(); else showHub();
}
window.addEventListener("pagehide", () => stopMedia());
window.addEventListener("beforeunload", () => { SCORM.set("cmi.core.exit", "suspend"); SCORM.set("cmi.core.session_time", fmtTime(Date.now() - startedAt)); SCORM.end(); });
boot();
</script>
</body>
